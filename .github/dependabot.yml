version: 2
updates:
  # Rust crate updates. Grouped so the noise from a routine bump
  # doesn't flood the PR queue.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # rubato 1.0+ ships a redesigned resampler API; FftFixedIn was
      # moved/renamed. src/processor/pipeline.rs would need a rewrite.
      - dependency-name: rubato
        versions: [">=1.0.0"]
    groups:
      cargo-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by .github/workflows/*.yml.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
